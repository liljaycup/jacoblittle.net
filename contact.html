<main id="main" class="wrap contact-main">
  <div class="two-col">
    <div class="contact-intro">
      <p class="label" style="margin:0;color:var(--accent);">Contact</p>
      <h1>Contact Jacob</h1>
      <p>For readings, review copies, editors, and anyone who worked a night shift and wants to talk about it.</p>
    </div>
    <form class="form" data-contact action="https://formspree.io/f/mgaavwep" method="POST">
      <input type="hidden" name="_subject" value="New message from jacoblittle.net">
      <div class="hp" aria-hidden="true"><label for="gotcha">Leave this empty</label><input id="gotcha" type="text" name="_gotcha" tabindex="-1" autocomplete="off"></div>
      <div class="row">
        <div class="field"><label for="first">First name</label><input id="first" name="first_name" type="text" autocomplete="given-name" required></div>
        <div class="field"><label for="last">Last name</label><input id="last" name="last_name" type="text" autocomplete="family-name" required></div>
      </div>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" inputmode="email" required></div>
      <div class="field"><label for="msg">Message</label><textarea id="msg" name="message" rows="6" required></textarea></div>
      <div class="form-foot"><small>All fields required.</small><button class="btn btn--solid" type="submit">Send message</button></div>
      <p class="form-status" data-status role="status" tabindex="-1" hidden></p>
    </form>
  </div>
</main>
